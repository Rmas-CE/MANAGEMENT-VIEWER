<style>
/* =====================================================================
   VaultSync theme for the TS POSM KPI Scorecard — NEXUS v4 light.
   Same selectors as before (only colours, fonts and surfaces changed),
   so the scorecard logic and layout are untouched.
   ===================================================================== */
:root{
  --bg:#F3F4F6; --bg2:#F7F8FA; --card:#FFFFFF; --card2:#F3F4F6; --line:#E3E6EB;
  --text:#12141A; --muted:#5B6270; --accent:#2A5FD9; --accent2:#1428A0;
  --good:#1E7A1E; --warn:#8A5A00; --bad:#B02A21;
  --good-bg:#E7F5E7; --warn-bg:#FFF3DE; --bad-bg:#FBE4E2; --info:#1E4FA6; --info-bg:#E7EEFB;
  --shadow:0 1px 2px rgba(15,20,30,.05),0 4px 16px rgba(15,20,30,.06);
  --font-ui:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-head:'Poppins','Inter',sans-serif;
}
*{box-sizing:border-box}
html{color-scheme:light}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--font-ui)}
body{background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:var(--vs-sticky,0);z-index:10;background:#fff;border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.hwrap{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;display:block;flex:none}
.logo svg{width:36px;height:36px;display:block;filter:drop-shadow(0 4px 10px rgba(20,40,160,.25))}
.brand h1{font-family:var(--font-head);font-size:16px;margin:0;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:1.2px;text-transform:uppercase;font-weight:600}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.controls label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:600}
input,select,textarea{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(42,95,217,.15)}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
input[type=date]{color-scheme:light}
.controls input[type=date]{width:150px}
nav{max-width:1280px;margin:0 auto;padding:0 16px;display:flex;gap:2px;overflow-x:auto}
nav button{background:none;border:none;padding:11px 14px;color:var(--muted);cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap;font-weight:600;font-size:13px}
nav button:hover{color:var(--text)}
nav button.active{color:var(--accent);border-color:var(--accent)}
main{max-width:1280px;margin:0 auto;padding:18px 16px 60px}
.grid{display:grid;gap:14px}
.cards{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.enc{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:start}
@media(max-width:900px){.two,.enc,.three{grid-template-columns:minmax(0,1fr)}}
.mt{margin-top:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px;min-width:0;box-shadow:var(--shadow)}
.card h3{margin:0 0 12px;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700}
.stat .v{font-family:var(--font-head);font-size:28px;font-weight:700}
.stat .s{color:var(--muted);font-size:12px}
.btn{background:#fff;border:1px solid var(--line);border-radius:7px;padding:8px 14px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;color:var(--text)}
.btn:hover{border-color:#C4C9D2}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--accent2);color:#fff;border:1px solid var(--accent2)}
.btn.pri:hover{background:#0B1B5C;border-color:#0B1B5C}
.btn.danger{color:var(--bad);border-color:#EBC1BD}
.btn.ok{color:var(--good);border-color:#B9DDB9}
.btn.sm{padding:5px 10px;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.8px;font-weight:700}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:hover td{background:rgba(42,95,217,.04)}
.chip{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;color:#12141A;white-space:nowrap}
.tag{display:inline-block;padding:2px 7px;border-radius:6px;font-size:10.5px;font-weight:700;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.ack{color:var(--good);border-color:#B9DDB9;background:var(--good-bg)}.tag.dis{color:var(--bad);border-color:#EBC1BD;background:var(--bad-bg)}.tag.pen{color:var(--warn);border-color:#EAD3A6;background:var(--warn-bg)}
.muted{color:var(--muted)}
.bar{height:10px;background:#EEF0F3;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px}
.kpibar{display:grid;grid-template-columns:minmax(110px,1.3fr) 3fr 64px;gap:10px;align-items:center;margin:8px 0}
.kpibar .n small{color:var(--muted)}
.kpibar .p{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.funnel .step{display:grid;grid-template-columns:140px 1fr 64px;gap:10px;align-items:center;margin:7px 0}
.funnel .fb{height:26px;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2));display:flex;align-items:center;padding-left:8px;font-weight:700;color:#fff;font-size:12px;min-width:2px}
@media(max-width:560px){.funnel .step{grid-template-columns:96px 1fr 56px}.kpibar{grid-template-columns:1fr 64px}.kpibar .bar{grid-column:1/-1;order:3}}
.sect{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;background:var(--bg2)}
.sect .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:4px}
.sect .hd b{font-size:14px}
.sect .hd span{font-size:12px;color:var(--accent);font-weight:700;white-space:nowrap}
.sect p{margin:0 0 10px;color:var(--muted);font-size:12px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.fields label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.fields input{width:100%}
.butbl input{width:100%;min-width:64px;padding:6px 8px;text-align:right}
.butbl td,.butbl th{padding:5px 4px;border:none}
input.auto{border-color:var(--accent);background:#EBF0FA}
.res{margin-top:10px;font-size:12px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.res b{color:var(--text)}
.err{color:var(--bad);font-size:12px;margin-top:6px}
.calc{font-variant-numeric:tabular-nums}
.calc .ln{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px;gap:8px}
.calc .ln span:first-child{color:var(--muted)}
.final{text-align:center;padding:14px 0 6px}
.final .v{font-family:var(--font-head);font-size:44px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.flag{background:var(--warn-bg);border:1px solid #EAD3A6;color:var(--warn);padding:7px 10px;border-radius:8px;font-size:12px;margin-top:6px}
.flag.red{color:var(--bad);border-color:#EBC1BD;background:var(--bad-bg)}
.flag.green{color:var(--good);border-color:#B9DDB9;background:var(--good-bg)}
.flag.blue{color:var(--info);border-color:#C3D3F2;background:var(--info-bg)}
.sticky{position:sticky;top:calc(var(--vs-sticky,0px) + 120px)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#12141A;color:#fff;border:1px solid #12141A;padding:10px 18px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:60;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.show{opacity:1}
.empty{padding:30px;text-align:center;color:var(--muted)}
.hidden{display:none!important}
svg text{fill:var(--muted);font-size:13px}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:end}
.pod{border-radius:10px;padding:12px 10px;text-align:center;border:1px solid var(--line);background:var(--bg2)}
.pod .rk{font-size:11px;font-weight:800;letter-spacing:1px;padding:3px 10px;border-radius:99px;display:inline-block;color:#1a1a1a}
.pod .nm{font-weight:700;margin-top:8px;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .sc{font-family:var(--font-head);font-size:22px;font-weight:700;margin-top:2px}
.pod.p1{padding-top:26px;border-color:#D9B44A;background:#FFF9E8;box-shadow:0 0 0 1px rgba(217,180,74,.25)}
.modal{position:fixed;inset:0;background:rgba(10,14,39,.55);display:grid;place-items:center;z-index:50;padding:16px}
.modal .box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;width:min(380px,100%);box-shadow:0 20px 50px rgba(0,0,0,.2)}
.sync{font-size:11px;padding:4px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;background:#fff}
.sync.on{color:var(--good);border-color:#B9DDB9;background:var(--good-bg)}.sync.err{color:var(--bad);border-color:#EBC1BD;background:var(--bad-bg)}
.insight{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px}
.insight i{font-style:normal;flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff}
code{background:var(--card2);padding:1px 5px;border-radius:4px;font-size:12px}
ol.steps{padding-left:18px;margin:6px 0;font-size:12.5px;color:var(--muted)}
ol.steps li{margin:4px 0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media print{
  header,nav,.noprint{display:none!important}
  body{background:#fff;color:#000}
  .card{background:#fff;border:1px solid #ccc;color:#000;break-inside:avoid;box-shadow:none}
  .muted,th,.card h3{color:#444}
}

/* ===== VaultSync suite bar — shared by every VaultSync tool =====
   --vs-sticky is the space other sticky headers must leave for the bar:
   44px on desktop (bar stays pinned), 0 on phones (bar scrolls away). */
:root{--vs-sticky:44px}
.vs-suite{position:sticky;top:0;z-index:35;height:44px;display:flex;align-items:center;gap:12px;padding:0 16px;
  background:linear-gradient(100deg,#000 0%,#0B1B5C 50%,#1428A0 100%);color:#fff;font:600 13px/1 'Inter',system-ui,-apple-system,sans-serif}
.vs-suite a{color:inherit;text-decoration:none}
.vs-suite .vs-home{display:flex;align-items:center;gap:8px;flex:none;font-family:'Poppins','Inter',sans-serif;font-weight:800;font-size:15px;letter-spacing:-.01em;padding:4px 2px}
.vs-suite .vs-home svg{width:26px;height:26px;display:block}
.vs-suite .vs-home b{font-weight:800;color:#7FD8FF}
.vs-suite nav{display:flex;gap:2px;margin:0 0 0 auto;overflow-x:auto;scrollbar-width:none;min-width:0;padding:0;border:0;background:none;max-width:none}
.vs-suite nav::-webkit-scrollbar{display:none}
.vs-suite nav a{padding:9px 11px;border-radius:7px;color:#C7CDEE;white-space:nowrap;font-weight:600}
.vs-suite nav a:hover{color:#fff;background:rgba(255,255,255,.1)}
.vs-suite nav a[aria-current="page"]{color:#fff;background:rgba(255,255,255,.16)}
.vs-suite :focus-visible{outline:2px solid #7FD8FF;outline-offset:1px}
@media (max-width:900px){ :root{--vs-sticky:0px} .vs-suite{position:relative} }
@media (max-width:600px){ .vs-suite{padding:0 10px;gap:6px} .vs-suite .vs-home span{display:none} .vs-suite nav a{padding:9px 9px} }
@media print{ .vs-suite{display:none!important} }
</style>
<style>
/* ---------- Report slide ---------- */
#slideDlg{max-width:none;width:min(1340px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto}
.sbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.sbar h3{margin:0;font-size:16px}
.sbar .grp{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sbar .grp span{font-size:13px;color:var(--muted)}
.sbtn{border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:6px;cursor:pointer;font-weight:600;font-size:13.5px}
.sbtn:hover{background:var(--hover)}
.sbtn.primary{background:#2F57C9;border-color:#2F57C9;color:#fff}
.sbtn:disabled{opacity:.6;cursor:progress}
.sstage{padding:16px;background:var(--bg)}
.sfit{position:relative;margin:0 auto;box-shadow:0 2px 14px rgba(5,15,20,.18)}
.slide{
  --bg:#EEF2F1; --panel:#FFFFFF; --ink:#10232C; --muted:#5B6E75; --line:#D5DEDF;
  --brand:#1B3E9E; --band:#0F2A36; --band-ink:#E6EEF0;
  --ok:#1D7A53; --ok-bg:#DDF1E7; --warn:#A96A00; --warn-bg:#FBEBCB; --bad:#B0332B; --bad-bg:#F8DEDB; --track:#E3E9EA;
  width:1280px;height:720px;position:absolute;top:0;left:0;transform-origin:0 0;overflow:hidden;
  background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,sans-serif;font-size:14px;line-height:1.35;
  display:grid;grid-template-rows:auto auto 1fr auto;
}
.sl-head{background:var(--band);color:var(--band-ink);padding:20px 36px 18px;display:flex;justify-content:space-between;align-items:flex-end;gap:24px;border-bottom:5px solid #2F57C9}
.sl-head h1{margin:0;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:36px;line-height:1}
.sl-head p{margin:6px 0 0;color:#9FB4BB;font-size:15px}
.sl-head .when{text-align:right;font-size:13px;color:#9FB4BB;white-space:nowrap}
.sl-head .when b{display:block;color:var(--band-ink);font-size:15px;font-weight:600}
.sl-kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;padding:14px 36px 0}
.sl-kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px 11px;border-top:4px solid var(--c,var(--line))}
.sl-kpi h4{margin:0;font-size:13px;font-weight:600;color:var(--muted)}
.sl-kpi .v{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:40px;line-height:1;margin-top:4px;color:var(--c,var(--ink))}
.sl-kpi .v small{font-size:22px}
.sl-kpi p{margin:3px 0 0;font-size:12px;line-height:1.25;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl-kpi h4{white-space:nowrap}
.sl-body{display:grid;grid-template-columns:1.05fr 1fr;gap:16px;padding:14px 36px 0;min-height:0}
.sl-box{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;min-height:0;overflow:hidden}
.sl-box h3{margin:0 0 6px;font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sl-box h3 span{font-size:12px;font-weight:500;color:var(--muted)}
.sl-t{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}

<script>
/* =====================================================================
   ONLINE CONFIG — fill these in ONCE before uploading to GitHub Pages.
   With KPI_SHEET_URL set, every device that opens the page syncs
   automatically (no need to paste the URL on each phone/laptop).
   ===================================================================== */
const CONFIG={
  KPI_SHEET_URL:'https://script.google.com/macros/s/AKfycbygdnoRRsnSS20w047MS2lNOjY9pqxCNb-ehatEEdriwgUdzlw_vXz5vDixwDCqupTc/exec',     // Web App URL of THIS tool's Google Sheet (Code.gs) — ends in /exec
  INVENTORY_URL:'https://script.google.com/macros/s/AKfycbxJ7UqqR7WKe9iBu1y9QUm4UdFsZT-oNLnRdwNsG1M2i3DrjvW0YnXY1QHb4H22SQse/exec',     // RMAS Inventory Tool
  DEPLOYMENT_URL:'https://script.google.com/macros/s/AKfycbyqiLr5I2Cy0dQRdNxZenefc06ITJ4tduwpc6QB2mRglUbUMJvqElesO58W6kA9b3dXCQ/exec'     // POSM KPI Command Center / Deployment KPI Tool
};
/* =====================================================================
   CONFIG
   ===================================================================== */
const STORE_KEY='vsviewer_rmas_ts_posm_kpi_v4', OLD_KEY='vsviewer_rmas_ts_posm_kpi_v3', ROLE_KEY='vsviewer_rmas_kpi_role', URL_KEY='vsviewer_rmas_kpi_sheet_url';
const BUS=['AV','HA','AC'];
const BU_FIELDS=[['required','Target deployments'],['complete','Complete'],['fullDep','Incomplete – Full Dep. (no stock)'],['delivered','Request POSM delivered (qty)']];
const BU_SHORT={required:'Target',complete:'Complete',fullDep:'Inc. Full Dep.',delivered:'Request delivered qty'};
const DEFAULT_WEIGHTS={dep:40,rep:40,com:20};
const DEFAULT_GRADES=[
  {min:95,label:'Outstanding',color:'#19d3c5'},{min:90,label:'Excellent',color:'#3fa9f5'},
  {min:85,label:'Very Good',color:'#7dd3fc'},{min:80,label:'Good',color:'#a3e635'},
  {min:75,label:'Needs Improvement',color:'#f59e0b'},{min:0,label:'Poor',color:'#ef4444'}];
const DEFAULT_DEDUCTIONS=[
  {id:'d1',label:'Fake / recycled photo proof',pts:5},
  {id:'d2',label:'Unreported damaged / outdated POSM found in audit',pts:3},
  {id:'d3',label:'POSM deployed not per allocation (wrong store/model)',pts:3},
  {id:'d4',label:'No-show on RMAS-scheduled store visit without notice',pts:2}];
const FLAT={
  req:[['reqDeployed','Delivered request POSM actually deployed (qty) — only if partially deployed']],
  audit:[['auditStores','Stores audited (random audit)'],['auditVerified','Stores with verified actual display']],
  rep:[['repDue','Reports due'],['repOnTime','Submitted on time'],['repAccurate','Accurate (no corrections needed)'],['reported','Deployments reported with photo proof']],
  com:[['comSent','RMAS instructions / concerns sent'],['comResp','Acknowledged / responded within SLA'],['meetReq','Meetings / huddles required'],['meetAtt','Meetings / huddles attended']]
};
const FLAT_KEYS=Object.values(FLAT).flat().map(f=>f[0]);
const BU_PATHS=BUS.flatMap(b=>BU_FIELDS.map(([f])=>`bu.${b}.${f}`));
const ALL_PATHS=[...BU_PATHS,...FLAT_KEYS];
const FIELD_LABEL=Object.fromEntries([...BU_FIELDS,...Object.values(FLAT).flat()]);

/* =====================================================================
   UTILS
   ===================================================================== */
const n=v=>{const x=parseFloat(v);return isFinite(x)&&x>=0?x:0};
const has=v=>v!==undefined&&v!==null&&v!=='';
const clamp=x=>Math.max(0,Math.min(1,x));
const avg=a=>a.length?a.reduce((p,q)=>p+q,0)/a.length:null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=(x,d=1)=>x==null?'—':(x*100).toFixed(d)+'%';
const fx=(x,d=2)=>x==null?'—':x.toFixed(d)+'%';
function getP(o,p){return p.split('.').reduce((x,k)=>x==null?undefined:x[k],o)}
function setP(o,p,v){const ks=p.split('.');let x=o;ks.slice(0,-1).forEach(k=>{if(!x[k]||typeof x[k]!=='object')x[k]={};x=x[k]});x[ks[ks.length-1]]=v}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2600)}
/* ---- Date range periods ----
   A grading period is a date range stored as "YYYY-MM-DD~YYYY-MM-DD" (start~end).
   Old month keys "YYYY-MM" are converted to the full month range on load. */
const pad2=x=>String(x).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const todayYmd=()=>ymd(new Date());
const pDate=v=>{const [y,m,d]=v.split('-').map(Number);return new Date(y,m-1,d)};
function lastDay(ym){const [y,m]=ym.split('-').map(Number);return ymd(new Date(y,m,0))}
function monthToPeriod(ym){return ym+'-01~'+lastDay(ym)}
function pStart(p){return String(p).split('~')[0]}
function pEnd(p){const x=String(p).split('~');return x[1]||x[0]}
function isFullMonth(p){const s=pStart(p),e=pEnd(p);return s.slice(8)==='01'&&s.slice(0,7)===e.slice(0,7)&&e===lastDay(s.slice(0,7))}
function periodHasToday(p){const t=todayYmd();return pStart(p)<=t&&t<=pEnd(p)}
function inPeriod(d,p){return !!d&&pStart(p)<=d&&d<=pEnd(p)}
// Long label: "September 2026" (whole month) · "Sep 5, 2026" · "Sep 5 – Oct 4, 2026" · "Dec 15, 2025 – Jan 14, 2026"
function monthLabel(p){p=String(p||'');if(p===LIVE)return 'Live data';if(/^\d{4}-\d{2}$/.test(p))p=monthToPeriod(p);if(!p.includes('-'))return p;
  const s=pDate(pStart(p)),e=pDate(pEnd(p));
  if(isFullMonth(p))return s.toLocaleString('en',{month:'long',year:'numeric'});
  const md=d=>d.toLocaleString('en',{month:'short',day:'numeric'}),full=d=>d.toLocaleString('en',{month:'short',day:'numeric',year:'numeric'});
  if(pStart(p)===pEnd(p))return full(s);
  return s.getFullYear()===e.getFullYear()?md(s)+' – '+full(e):full(s)+' – '+full(e)}
// Short label for chart axes / table headers
function monthShort(p){p=String(p||'');if(/^\d{4}-\d{2}$/.test(p))p=monthToPeriod(p);const s=pDate(pStart(p)),e=pDate(pEnd(p));
  if(isFullMonth(p))return s.toLocaleString('en',{month:'short'})+' '+String(s.getFullYear()).slice(2);
  const md=d=>(d.getMonth()+1)+'/'+d.getDate();return pStart(p)===pEnd(p)?md(s):md(s)+'–'+md(e)}
// Any date value → "YYYY-MM-DD" in local time ('' if unreadable)
function dateOf(v){if(v===undefined||v===null||v==='')return '';if(v instanceof Date)return isNaN(v)?'':ymd(v);const s=String(v).trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)||/^\d{4}-\d{2}-\d{2}[ T]\d{1,2}:\d{2}(:\d{2})?$/.test(s))return s.slice(0,10);
  const d=new Date(s);return isNaN(d)?'':ymd(d)}
function periodKeys(){return [...new Set(Object.keys(S.records).map(k=>k.split('|')[0]))].sort()}
function prevPeriod(p){return periodKeys().filter(x=>x<p).pop()||null}
/* ---- Continuous (live) grading ----
   No month / date range: every TS has ONE live grade (key "LIVE|<tsId>") that is refreshed
   whenever data changes in the Deployment KPI Tool and Inventory Tool. */
const LIVE='LIVE';
function download(name,text,type){const b=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function csvCell(v){v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function toCsv(lines){return lines.map(l=>l.map(csvCell).join(',')).join('\n')}
function parseCsv(text){text=text.replace(/^﻿/,'');const rows=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const c=text[i];
  if(q){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')q=false;else cell+=c}
  else if(c==='"')q=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}else cell+=c}
  if(cell||row.length){row.push(cell);rows.push(row)}return rows.filter(r=>r.some(x=>String(x).trim()))}
function copyFallback(t){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove()}
function copyText(t){if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(t).catch(()=>copyFallback(t));copyFallback(t);return Promise.resolve()}
function uid(p='ts'){return p+Math.random().toString(36).slice(2,9)}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* =====================================================================
   KPI DEFINITIONS
   ===================================================================== */
// deployed = "done" = Complete + Incomplete-Full-Deployment (no stock available → counted as complete)
function agg(r){const o={required:0,complete:0,fullDep:0,delivered:0,anyBU:false};
  BUS.forEach(b=>{const x=(r.bu||{})[b]||{};BU_FIELDS.forEach(([f])=>{if(has(x[f])){o[f]+=n(x[f]);o.anyBU=true}})});
  o.deployed=o.complete+o.fullDep;o.incomplete=Math.max(0,o.required-o.deployed);return o}
const buDone=x=>n(x.complete)+n(x.fullDep);
// Request deployment (Inventory Tool requests + RMAS verification):
//  verified  → 100% (all delivered request POSM deployed, or no request)
//  partial   → deployed qty ÷ delivered qty
//  not yet verified → not counted (pending)
function reqScore(r,a){a=a||agg(r);if(r.reqVerify==='verified')return 1;if(r.reqVerify==='partial')return a.delivered>0?clamp(n(r.reqDeployed)/a.delivered):null;return null}
function verRate(r){return n(r.auditStores)>0?clamp(n(r.auditVerified)/n(r.auditStores)):1}
function buRate(r,b){const x=(r.bu||{})[b]||{};return n(x.required)>0?clamp(Math.min(buDone(x),n(x.required))/n(x.required)):null}

const KPIS=[
 {key:'dep',name:'POSM Deployment Execution',short:'Deployment',
  desc:'Deployment status per BU from the Deployment KPI Tool (Incomplete – Full Deployment = no available stock, counted as complete), plus deployment of the POSM the TS requested and received from the Inventory Tool, verified by RMAS. No request = 100% once RMAS verifies.',
  formula:'Average of: ((Complete + Incomplete Full Dep.) × Audit verification rate) ÷ Target, and Request deployment (RMAS-verified: 100%, or deployed qty ÷ delivered qty)',
  calc:(r,a)=>{const p=[];if(a.required>0)p.push(clamp(Math.min(a.deployed,a.required)*verRate(r)/a.required));const q=reqScore(r,a);if(q!=null)p.push(q);return avg(p)},
  check:(r,a)=>{const e=[];BUS.forEach(b=>{const x=(r.bu||{})[b]||{};if(buDone(x)>n(x.required)&&has(x.required))e.push(`${b}: Complete + Incomplete Full Dep. cannot exceed Target.`)});
    if(n(r.auditVerified)>n(r.auditStores))e.push('Verified stores cannot exceed stores audited.');if(r.reqVerify==='partial'&&n(r.reqDeployed)>a.delivered)e.push('Deployed request POSM cannot exceed delivered qty.');return e}},
 {key:'rep',name:'POSM Reporting Accuracy & Timeliness',short:'Reporting',
  desc:'Correct and on-time submission of POSM reports, plus deployments reported with photo proof.',
  formula:'Average of: On-time ÷ Due, Accurate ÷ Due, Reported with proof ÷ Deployed',
  calc:(r,a)=>{const p=[];const d=n(r.repDue);if(d>0){p.push(clamp(n(r.repOnTime)/d));p.push(clamp(n(r.repAccurate)/d))}
    if(a.deployed>0&&has(r.reported))p.push(clamp(n(r.reported)/a.deployed));return avg(p)},
  check:(r,a)=>{const e=[];if(n(r.repOnTime)>n(r.repDue))e.push('On-time reports cannot exceed reports due.');
    if(n(r.repAccurate)>n(r.repDue))e.push('Accurate reports cannot exceed reports due.');
    if(n(r.reported)>a.deployed)e.push('Reported deployments cannot exceed Complete + Incomplete Full Dep.');return e}},
 {key:'com',name:'Communication',short:'Communication',
  desc:'Responsiveness to RMAS instructions/concerns, timely escalation of POSM issues, and attendance to meetings/huddles.',
  formula:'Average of: Responded within SLA ÷ Instructions sent, Attended ÷ Meetings required',
  calc:(r)=>{const p=[];if(n(r.comSent)>0)p.push(clamp(n(r.comResp)/n(r.comSent)));if(n(r.meetReq)>0)p.push(clamp(n(r.meetAtt)/n(r.meetReq)));return avg(p)},
  check:(r)=>{const e=[];if(n(r.comResp)>n(r.comSent))e.push('Responded cannot exceed instructions sent.');
    if(n(r.meetAtt)>n(r.meetReq))e.push('Attended cannot exceed meetings required.');return e}}
];

  dep:'Close the remaining Incomplete deployments: schedule store visits per BU, confirm install dates with store managers, and make sure every deployed POSM is actually displayed (audit verification affects the score).',
  rep:'Submit reports on or before the due date, double-check counts before sending, and attach photo proof for every deployment.',
  com:'Acknowledge RMAS instructions within the SLA, attend all huddles, and escalate POSM issues (missing, damaged, wrong model) the same day.'

let S, role='viewer', sheetUrl=CONFIG.KPI_SHEET_URL||lsGet(URL_KEY)||'';
function load(){try{const x=lsGet(STORE_KEY);if(x){const o=JSON.parse(x);if(o&&o.ts&&o.records)return o}}catch(e){}return null}
function normalizeState(o){o.weights=o.weights||{...DEFAULT_WEIGHTS};o.grades=o.grades||DEFAULT_GRADES.map(g=>({...g}));
  o.deductions=o.deductions||DEFAULT_DEDUCTIONS.map(d=>({...d}));o.adminPass=o.adminPass||'admin123';o.sources=Object.assign({inventoryUrl:'',autoPull:true,lastPull:null,deploymentUrl:'',depAutoPull:true,depLastPull:null},o.sources||{});if(CONFIG.INVENTORY_URL)o.sources.inventoryUrl=CONFIG.INVENTORY_URL;if(CONFIG.DEPLOYMENT_URL)o.sources.deploymentUrl=CONFIG.DEPLOYMENT_URL;o.buMap=o.buMap||{};o.deleted=o.deleted||{};o.deletedTs=o.deletedTs||{};
  // Convert old per-month keys ("2026-09|id") into date-range keys ("2026-09-01~2026-09-30|id")
  const now=new Date().toISOString();
  Object.keys(o.records).forEach(k=>{const i=k.indexOf('|'),m=k.slice(0,i),id=k.slice(i+1);if(!/^\d{4}-\d{2}$/.test(m))return;
    const nk=monthToPeriod(m)+'|'+id,r=o.records[k];if(!o.records[nk]||String(r.updated||'')>String(o.records[nk].updated||''))o.records[nk]=r;
    delete o.records[k];if(String(o.deleted[k]||'')<now)o.deleted[k]=now});
  // Start the live grade from each TS's latest saved grade (keeps manual inputs like reports / communication / RMAS verification)
  const latest={};Object.keys(o.records).forEach(k=>{const i=k.indexOf('|'),pk=k.slice(0,i),id=k.slice(i+1);if(pk===LIVE)return;if(!latest[id]||pk>latest[id])latest[id]=pk});
  Object.entries(latest).forEach(([id,pk])=>{const lk=LIVE+'|'+id;if(o.records[lk]||o.deleted[lk])return;o.records[lk]=JSON.parse(JSON.stringify(o.records[pk+'|'+id]))});
  return o}
/* ---- change stamping: every edit gets a timestamp so multi-device merges keep the newest version ---- */
const SETTING_KEYS=['weights','grades','deductions','adminPass','sources','buMap'];
const noUpd=o=>{const c=Object.assign({},o);delete c.updated;return JSON.stringify(c)};
let lastSnap=null;
function snap(){return {settings:JSON.stringify(SETTING_KEYS.map(k=>S[k])),ts:Object.fromEntries(S.ts.map(t=>[t.id,noUpd(t)])),rec:Object.fromEntries(Object.entries(S.records).map(([k,r])=>[k,noUpd(r)]))}}
function stamp(){const now=new Date().toISOString();if(!lastSnap){lastSnap=snap();return}
  if(lastSnap.settings!==JSON.stringify(SETTING_KEYS.map(k=>S[k])))S.settingsUpdated=now;
  S.ts.forEach(t=>{if(lastSnap.ts[t.id]!==noUpd(t))t.updated=now});Object.keys(lastSnap.ts).forEach(id=>{if(!S.ts.some(t=>t.id===id))S.deletedTs[id]=now});
  Object.entries(S.records).forEach(([k,r])=>{if(lastSnap.rec[k]!==noUpd(r))r.updated=now});Object.keys(lastSnap.rec).forEach(k=>{if(!S.records[k])S.deleted[k]=now});
  lastSnap=snap()}
function save(push=true){stamp();lsSet(STORE_KEY,JSON.stringify(S));if(push)schedulePush()}
/* Same merge runs in the browser and in Code.gs: newest record / TS / settings win; deletions are remembered. */
function mergeState(a,b){
  if(!a||!a.records)return b;if(!b||!b.records)return a;
  const str=v=>String(v||'');const o={};
  const base=str(a.settingsUpdated)>=str(b.settingsUpdated)?a:b;
  ['weights','grades','deductions','adminPass','sources','buMap','settingsUpdated'].forEach(function(k){o[k]=base[k]});
  const tomb=function(x,y){const t=Object.assign({},x||{});Object.keys(y||{}).forEach(function(k){if(!t[k]||str(y[k])>str(t[k]))t[k]=y[k]});return t};
  o.deleted=tomb(a.deleted,b.deleted);o.deletedTs=tomb(a.deletedTs,b.deletedTs);
  o.records={};Object.keys(Object.assign({},a.records,b.records)).forEach(function(k){const x=a.records[k],y=b.records[k];
    const r=!x?y:!y?x:(str(x.updated)>=str(y.updated)?x:y);if(o.deleted[k]&&str(o.deleted[k])>=str(r.updated))return;o.records[k]=r});
  const m={};(a.ts||[]).concat(b.ts||[]).forEach(function(t){const c=m[t.id];if(!c||str(t.updated)>str(c.updated))m[t.id]=t});
  o.ts=Object.keys(m).map(function(id){return m[id]}).filter(function(t){return !(o.deletedTs[t.id]&&str(o.deletedTs[t.id])>=str(t.updated))});
  return o}

function emptyData(){return normalizeState({ts:[],records:{}})}
// First run of v4: keep settings (weights, grades, deductions, password, connected tools) from the old version, drop the sample TS & grades.
function migrate(){try{const x=lsGet(OLD_KEY);if(!x)return null;const o=JSON.parse(x);return normalizeState({ts:[],records:{},weights:o.weights,grades:o.grades,deductions:o.deductions,adminPass:o.adminPass,sources:o.sources})}catch(e){return null}}
S=load()||migrate()||emptyData();normalizeState(S);lastSnap=snap();lsSet(STORE_KEY,JSON.stringify(S));

/* =====================================================================
   COMPUTE
   ===================================================================== */
function gradeOf(score){if(score==null)return null;const g=[...S.grades].sort((a,b)=>b.min-a.min);return g.find(x=>score>=x.min)||g[g.length-1]}
function compute(r){
  const a=agg(r),scores={},lines=[];let wsum=0,tot=0;
  KPIS.forEach(k=>{const s=k.calc(r,a);scores[k.key]=s;const w=S.weights[k.key]||0;if(s!=null){wsum+=w;tot+=s*w}lines.push({k,s,w,contrib:s!=null?s*w:null})});
  const weighted=wsum>0?tot/wsum*100:null;
  const ded=(r.deductions||[]).reduce((x,d)=>x+n(d.pts),0);
  const final=weighted==null?null:Math.max(0,weighted-ded);
  const errors=KPIS.flatMap(k=>k.check(r,a));
  const flags=[];
  if(a.required>0&&a.incomplete>0)flags.push(['',`${a.incomplete} of ${a.required} deployment(s) still Incomplete — not credited.`]);
  if(a.fullDep>0)flags.push(['blue',`${a.fullDep} deployment(s) marked Incomplete – Full Deployment (no available POSM stock) — counted as complete.`]);
  if(!r.reqVerify)flags.push(['blue',a.delivered>0?`Request deployment pending RMAS verification (${a.delivered} request POSM delivered).`:'No request POSM delivered — becomes 100% once RMAS verifies deployment is complete.']);
  if(r.reqVerify==='partial'&&a.delivered>n(r.reqDeployed))flags.push(['',`${a.delivered-n(r.reqDeployed)} of ${a.delivered} delivered request POSM not deployed.`]);
  if(n(r.auditStores)>0&&n(r.auditVerified)<n(r.auditStores))flags.push(['red',`Audit: only ${n(r.auditVerified)} of ${n(r.auditStores)} audited stores had actual display — deployment credit reduced to ${pct(verRate(r))}.`]);
  if(has(r.reported)&&a.deployed>n(r.reported))flags.push(['',`${a.deployed-n(r.reported)} deployments not reported with photo proof.`]);
  if(n(r.comSent)>n(r.comResp))flags.push(['',`${n(r.comSent)-n(r.comResp)} RMAS instructions/concerns not responded within SLA.`]);
  if(ded>0)flags.push(['red',`Deductions applied: −${ded} pts (${(r.deductions||[]).map(d=>esc(d.label)).join('; ')}).`]);
  const missing=lines.filter(l=>l.s==null).map(l=>l.k.short);
  if(missing.length&&weighted!=null)flags.push(['blue',`No data for: ${missing.join(', ')} — weights redistributed across the other KPIs.`]);
  return {a,scores,lines,weighted,ded,final,grade:gradeOf(final),errors,flags,wsum};
}
const chip=g=>g?`<span class="chip" style="background:${g.color}">${g.label}</span>`:'<span class="muted">Not graded</span>';
function ackTag(r){if(!r||compute(r).final==null)return '';const s=r.ack?.status;
  return s==='acknowledged'?'<span class="tag ack">Acknowledged</span>':s==='disputed'?'<span class="tag dis">Disputed</span>':'<span class="tag pen">Pending ack</span>'}
function recOf(m,id){return S.records[m+'|'+id]}
function history(id,upto){return Object.keys(S.records).filter(k=>k.endsWith('|'+id)).map(k=>k.split('|')[0]).filter(m=>!upto||m<=upto).sort()
  .map(m=>({m,r:S.records[m+'|'+id],c:compute(S.records[m+'|'+id])})).filter(h=>h.c.final!=null)}
function watch(id,m){const h=history(id,m);const out=[];if(!h.length||h[h.length-1].m!==m)return out;const L=h.length;
  // Only judge complete grades: a TS still missing Reporting/Communication (not yet encoded) is not put on the watchlist
  if(h[L-1].c.lines.some(l=>l.s==null)){if(h[L-1].r.ack?.status==='disputed')out.push('Grade disputed by TS');return out}
  if(h[L-1].c.final<75)out.push('Poor rating ('+h[L-1].c.final.toFixed(1)+'%)');
  else if(h[L-1].c.final<80)out.push('Below 80% ('+h[L-1].c.final.toFixed(1)+'%)');
  if(h[L-1].r.ack?.status==='disputed')out.push('Grade disputed by TS');
  return out}
function monthRank(m){return filteredTs().map(t=>({t,r:recOf(m,t.id)})).filter(x=>x.r).map(x=>({...x,c:compute(x.r)})).filter(x=>x.c.final!=null).sort((a,b)=>b.c.final-a.c.final)}

function findTs(name){const k=nameKey(name);if(!k)return null;return S.ts.find(t=>nameKey(t.name)===k||(t.aliases||[]).some(a=>nameKey(a)===k))||null}

  BU_FIELDS.forEach(([f])=>$('tot_'+f).textContent=c.a[f]);

    $('err_'+k.key).textContent=k.check(draft,c.a).join(' ')});
  $('eCalc').innerHTML=c.lines.map(l=>`<div class="ln"><span>${l.k.short}</span><span>${l.s==null?'<span class="muted">N/A</span>':`${pct(l.s,2)} × ${l.w}% = <b>${l.contrib.toFixed(2)}</b>`}</span></div>`).join('')+
    `<div class="ln"><span>Weighted score${c.wsum!==100&&c.weighted!=null?` (÷ ${c.wsum}%)`:''}</span><span><b>${fx(c.weighted)}</b></span></div>`+
    (c.ded?`<div class="ln"><span>Deductions</span><span style="color:#B02A21"><b>−${c.ded.toFixed(2)}</b></span></div>`:'');

function sig(r){return JSON.stringify([r.reqVerify||'',ALL_PATHS.map(p=>getP(r,p)??''),(r.deductions||[]).map(d=>d.label+d.pts).sort()])}
function cleanRec(d){const rec={bu:{}};ALL_PATHS.forEach(p=>{const v=getP(d,p);if(has(v))setP(rec,p,n(v))});
  rec.deductions=(d.deductions||[]).map(x=>({label:String(x.label),pts:n(x.pts)}));rec.src={};Object.keys(d.src||{}).forEach(p=>{if(has(getP(d,p)))rec.src[p]=d.src[p]});

function insights(cur,prev,rank,total){
  const out=[];const c=cur.c,r=cur.r;
  const ls=c.lines.filter(l=>l.s!=null).sort((a,b)=>b.s-a.s);
  if(ls.length){out.push(['g','+',`Strongest area: <b>${ls[0].k.name}</b> at ${pct(ls[0].s)}.`]);
    const w=ls[ls.length-1];if(ls.length>1&&w.s<0.95)out.push(['w','!',`Focus area: <b>${w.k.name}</b> at ${pct(w.s)}. ${TIPS[w.k.key]}`])}
  const bus=BUS.map(b=>({b,r:buRate(r,b),x:(r.bu||{})[b]||{}})).filter(x=>x.r!=null).sort((a,b)=>a.r-b.r);
  if(bus.length>1&&bus[0].r<bus[bus.length-1].r-0.05)out.push(['w','!',`${bus[0].b} deployment is the lowest at ${pct(bus[0].r)} (${buDone(bus[0].x)} of ${n(bus[0].x.required)} done) vs ${bus[bus.length-1].b} at ${pct(bus[bus.length-1].r)}. Prioritize ${bus[0].b} store visits.`]);
  if(n(r.auditStores)>0&&verRate(r)<1)out.push(['b','A',`Audit found ${n(r.auditStores)-n(r.auditVerified)} of ${n(r.auditStores)} store(s) without actual display, which reduced the deployment credit to ${pct(verRate(r))} of what was reported.`]);
  if(c.ded)out.push(['w','−',`Deductions of ${c.ded} pts applied. Without them the score would be ${fx(c.weighted)} (${gradeOf(c.weighted).label}).`]);
  if(prev){const d=c.final-prev.c.final;out.push([d>=0?'g':'w',d>=0?'▲':'▼',`${d>=0?'Improved':'Dropped'} ${Math.abs(d).toFixed(2)} pts vs ${monthLabel(prev.m)}.`])}
  if(rank)out.push(['b','#',`Ranked <b>${rank}</b> of ${total} graded TS${$('gRegion').value?' in '+esc($('gRegion').value):''}.`]);
  const nextG=[...S.grades].sort((a,b)=>a.min-b.min).find(g=>g.min>c.final);if(nextG)out.push(['b','↑',`Needs +${(nextG.min-c.final).toFixed(2)} pts to reach <b>${nextG.label}</b>.`]);
  return out;
}

const yes=v=>/^(y|yes|1|true|on ?time|ontime|✓|✔)$/i.test(String(v||'').trim());
function normH(h){return String(h).toUpperCase().replace(/[^A-Z0-9]/g,'')}
// Is a CSV date value inside the date range? true / false / null (unreadable).
// Full dates are checked day by day; a month-only value ("2026-09", "Sep 2026") counts when that month overlaps the range.
function rowInRange(v,p){v=String(v||'').trim();if(!v)return null;let x;
  if((x=v.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/)))return inPeriod(x[1]+'-'+pad2(x[2])+'-'+pad2(x[3]),p);
  if((x=v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/)))return inPeriod(x[3]+'-'+pad2(x[1])+'-'+pad2(x[2]),p);
  let ym=null;if((x=v.match(/^(\d{4})[-\/](\d{1,2})$/)))ym=x[1]+'-'+pad2(x[2]);else if((x=v.match(/^(\d{1,2})\/(\d{4})$/)))ym=x[2]+'-'+pad2(x[1]);
  else if(/^[A-Za-z]+\.?\s+\d{4}$/.test(v)){const d=new Date('1 '+v);if(!isNaN(d))ym=d.getFullYear()+'-'+pad2(d.getMonth()+1)}
  if(ym)return ym+'-01'<=pEnd(p)&&lastDay(ym)>=pStart(p);
  const d=dateOf(v);return d?inPeriod(d,p):null}
// BU mapping: admin-defined map first (Import & Sync → Data check), then common Samsung CE names.
function normBU(v){const raw=String(v||'').toUpperCase().trim();if(!raw)return null;if(BUS.includes(raw))return raw;
  const mp=(S.buMap||{})[raw];if(mp)return mp==='IGNORE'?null:mp;
  if(/\b(AC|RAC|SAC|CAC|AIRCON|AIRCONDITIONER|AIR CON|AIR CONDITIONER|WINDFREE|WIND-FREE)\b|AIRCON|AIR COND|WINDFREE/.test(raw))return 'AC';
  if(/\b(AV|VD|TV|LFD|SIGNAGE)\b|AUDIO|VISUAL|TELEVISION|SOUND|MONITOR|PROJECTOR|QLED|OLED|THE FRAME/.test(raw))return 'AV';
  if(/\b(HA|DA|REF|WM|MWO)\b|APPLIANCE|HOME|REFRIG|FRIDGE|WASH|LAUNDRY|DRYER|MICRO|COOK|OVEN|DISH|VACUUM|KITCHEN|BESPOKE/.test(raw))return 'HA';
  return null}

function flatRows(){const head=['Region','Trade Supervisor',...BU_PATHS.map(p=>p.split('.')[1]+' '+FIELD_LABEL[p.split('.')[2]]),...FLAT_KEYS.map(f=>FIELD_LABEL[f]),...KPIS.map(k=>k.short+' %'),'Weighted %','Deductions','Final %','Grade','Acknowledgment','TS Comment','Remarks','Last Updated'];
  const out=[head];const months=[LIVE];
  const all=[];months.forEach(m=>[...S.ts].sort((a,b)=>a.region.localeCompare(b.region)||a.name.localeCompare(b.name)).forEach(t=>all.push([m+'|'+t.id,S.records[m+'|'+t.id]||null])));
  all.forEach(([k,r])=>{const [m,id]=k.split('|');const t=S.ts.find(x=>x.id===id);if(!t)return;if(!r){out.push([t.region,t.name,...BU_PATHS.map(()=>''),...FLAT_KEYS.map(()=>''),...KPIS.map(()=>''),'','','','Not graded','','','','']);return}const c=compute(r);
    out.push([t.region,t.name,...BU_PATHS.map(p=>getP(r,p)??''),...FLAT_KEYS.map(f=>r[f]??''),...KPIS.map(k=>c.scores[k.key]==null?'':+(c.scores[k.key]*100).toFixed(2)),c.weighted==null?'':+c.weighted.toFixed(2),c.ded||'',c.final==null?'':+c.final.toFixed(2),c.grade?.label||'',r.ack?.status||(c.final!=null?'pending':''),r.ack?.comment||'',r.remarks||'',r.updated?new Date(r.updated).toLocaleString('en'):''])});return out}
const nowT=()=>new Date().toLocaleTimeString('en',{hour:'numeric',minute:'2-digit'});
// Adopt a merged state from the server without losing edits made meanwhile; re-render safely (never while typing a grade).
function adopt(remote){const before=JSON.stringify(S);S=normalizeState(mergeState(remote,S));lastSnap=snap();lsSet(STORE_KEY,JSON.stringify(S));
  const changed=before!==JSON.stringify(S);if(changed){fillRegions();if(view!=='enc'&&view!=='set'&&!$('modalHost').innerHTML)render()}return changed}
function localAhead(R,L){const str=v=>String(v||'');if(str(L.settingsUpdated)>str(R.settingsUpdated))return true;
  if(Object.entries(L.records).some(([k,r])=>!R.records[k]||str(r.updated)>str(R.records[k].updated)))return true;
  const rt=Object.fromEntries((R.ts||[]).map(t=>[t.id,t]));if(L.ts.some(t=>!rt[t.id]||str(t.updated)>str(rt[t.id].updated)))return true;
  const d=(x,y)=>Object.keys(x||{}).some(k=>!(y||{})[k]);return d(L.deleted,R.deleted)||d(L.deletedTs,R.deletedTs)}
let pushing=false,pushAgain=false;
async function pushRemote(manual){return;if(!sheetUrl)return;if(pushing){pushAgain=true;return}pushing=true;setSync('','Saving…');
  try{const res=await fetch(sheetUrl,{method:'POST',body:JSON.stringify({action:'save',data:S,rows:flatRows()})});const j=await res.json();if(!j.ok)throw new Error(j.error||'Save failed');
    if(j.data)adopt(j.data);setSync('on','Synced '+nowT());if(manual)toast('Pushed to Google Sheets')}
  catch(e){setSync('err','Sync error — will retry');if(manual)toast('Sync failed: '+e.message);clearTimeout(pushT);pushT=setTimeout(()=>pushRemote(false),30000)}
  finally{pushing=false;if(pushAgain){pushAgain=false;schedulePush()}}}
async function pullRemote(manual){if(!sheetUrl)return;if(!manual&&pushing)return;setSync('','Loading…');
  try{const res=await fetch(sheetUrl+(sheetUrl.includes('?')?'&':'?')+'action=load&t='+Date.now());const j=await res.json();if(!j.ok)throw new Error(j.error||'Load failed');
    if(j.data&&j.data.ts&&j.data.records){const ahead=localAhead(j.data,S);adopt(j.data);setSync('on','Synced '+nowT());if(manual)toast('Loaded latest data from Google Sheets');
      if(ahead)schedulePush()} // this device had edits the sheet doesn't have yet (e.g. saved while offline)
    else{setSync('on','Connected');await pushRemote(false);if(manual)toast('Connected — sheet was empty, uploaded current data')}}
  catch(e){setSync('err','Offline — changes kept on this device');if(manual)toast('Could not reach the sheet: '+e.message)}}
// keep every open device fresh: pull when the tab comes back into view, and every 2 minutes while visible
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')pullRemote(false)});
setInterval(()=>{if(document.visibilityState==='visible')pullRemote(false)},120000);

const CODE_GS=`/**
 * VaultSync — TS POSM KPI Grading backend (Google Apps Script)
 * Paste into Extensions > Apps Script of a Google Sheet, then
 * Deploy > New deployment > Web app (Execute as: Me, Access: Anyone).
 */
const DATA_SHEET = 'KPI_DATA';   // tool storage (do not edit)
const VIEW_SHEET = 'GRADES';     // readable table for reports
const CHUNK = 40000;

function doGet(e) {
  try { return out_({ ok: true, data: load_() }); }
  catch (err) { return out_({ ok: false, error: String(err) }); }
}

function doPost(e) {
  const lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try {
    const body = JSON.parse(e.postData.contents);
    if (body.action === 'save') {
      // Merge with what other devices saved (newest edit wins per record / TS; deletions kept)
      const merged = mergeState(load_(), body.data);
      save_(merged);
      if (body.rows) writeView_(body.rows);
      return out_({ ok: true, savedAt: new Date().toISOString(), data: merged });
    }
    return out_({ ok: false, error: 'Unknown action' });
  } catch (err) {
    return out_({ ok: false, error: String(err) });
  } finally { lock.releaseLock(); }
}

function sheet_(name) {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  return ss.getSheetByName(name) || ss.insertSheet(name);
}

function load_() {
  const sh = sheet_(DATA_SHEET);
  const n = sh.getLastRow();
  if (!n) return null;
  const txt = sh.getRange(1, 1, n, 1).getValues().map(r => String(r[0]).slice(1)).join('');
  return txt ? JSON.parse(txt) : null;
}

function save_(data) {
  const sh = sheet_(DATA_SHEET);
  const s = JSON.stringify(data);
  const rows = [];
  for (let i = 0; i < s.length; i += CHUNK) rows.push(['x' + s.slice(i, i + CHUNK)]); // 'x' prefix keeps cells as plain text
  sh.clear();
  if (rows.length) sh.getRange(1, 1, rows.length, 1).setValues(rows);
}

function writeView_(rows) {
  const sh = sheet_(VIEW_SHEET);
  sh.clear();
  if (!rows.length) return;
  const w = Math.max.apply(null, rows.map(r => r.length));
  const data = rows.map(r => { const x = r.slice(); while (x.length < w) x.push(''); return x; });
  sh.getRange(1, 1, data.length, w).setValues(data);
  sh.getRange(1, 1, 1, w).setFontWeight('bold').setBackground('#0e2733').setFontColor('#ffffff');
  sh.setFrozenRows(1);
}

${mergeState.toString()}

function out_(o) {
  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);
}
`;

let slideMode="top";
function buildSlide(){
  const m=month(),list=filteredTs(),reg=$('gRegion').value;
  const rows=list.map(t=>{const r=recOf(m,t.id);return {t,r,c:r?compute(r):null}});
  const graded=rows.filter(x=>x.c&&x.c.final!=null);
  const ranked=[...graded].sort((a,b)=>b.c.final-a.c.final);
  const av=avg(graded.map(x=>x.c.final)),gAv=gradeOf(av);
  const ackN=graded.filter(x=>x.r.ack?.status==='acknowledged').length,disN=graded.filter(x=>x.r.ack?.status==='disputed').length,penN=graded.length-ackN-disN;
  const partN=graded.filter(x=>x.c.lines.some(l=>l.s==null)).length;
  const wl=list.map(t=>({t,w:watch(t.id,m),c:recOf(m,t.id)?compute(recOf(m,t.id)):null})).filter(x=>x.w.length).sort((a,b)=>(a.c?.final??999)-(b.c?.final??999));
  let req=0,dep=0;graded.forEach(x=>{BUS.forEach(b=>{const y=(x.r.bu||{})[b]||{};req+=n(y.required);dep+=Math.min(buDone(y),n(y.required))})});
  const depRate=req?dep/req:null;
  const tn=p=>p==null?'na':p>=.9?'ok':p>=.8?'warn':'bad';
  const cv=t=>t==='na'?'var(--line)':`var(--${t})`;
  const tile=(h,c,v,sub)=>`<div class="sl-kpi" style="--c:${c}"><h4>${h}</h4><div class="v">${v}</div><p>${sub}</p></div>`;
  const kpis=
    tile('Average POSM KPI',cv(tn(av==null?null:av/100)),av==null?'—':av.toFixed(1)+'<small>%</small>',gAv?`Rating: ${esc(gAv.label)}`:'No grades yet')+
    tile('TS graded','var(--ink)',`${graded.length}<small> / ${list.length}</small>`,partN?`${partN} still partial (KPIs not encoded)`:'All grades complete')+
    tile('Deployment rate',cv(tn(depRate)),depRate==null?'—':Math.round(depRate*100)+'<small>%</small>',`${fmtN(dep)} of ${fmtN(req)} done`)+
    tile('Acknowledged',cv(graded.length?tn(ackN/graded.length):'na'),`${ackN}<small> / ${graded.length}</small>`,`${disN} disputed, ${penN} pending`)+
    tile('Watchlist',wl.length?'var(--warn)':'var(--ok)',String(wl.length),'TS needing coaching or follow-up');

  // ranking table
  const rank=new Map(ranked.map((x,i)=>[x.t.id,i+1]));
  const pick=slideMode==='top'?ranked.slice(0,10):ranked.slice(-10).reverse();
  const heat=s=>`<td class="hc h-${tn(s)}">${s==null?'—':Math.round(s*100)+'%'}</td>`;
  let rt=`<table class="sl-t"><colgroup><col style="width:5%"><col style="width:27%"><col style="width:15%"><col style="width:10%"><col style="width:10%"><col style="width:9%"><col style="width:9%"><col style="width:15%"></colgroup>
    <thead><tr><th>#</th><th class="lft">Trade Supervisor</th><th style="text-align:left">Region</th>${KPIS.map(k=>`<th>${k.short==='Communication'?'Comm.':k.short==='Deployment'?'Deploy':k.short==='Reporting'?'Report':esc(k.short)}</th>`).join('')}<th>Final</th><th style="text-align:left">Grade</th></tr></thead><tbody>`;
  rt+=pick.map(x=>{const part=x.c.lines.some(l=>l.s==null);
    return `<tr><td class="rk">${rank.get(x.t.id)}</td><td class="lft" style="font-family:Barlow,sans-serif;font-size:13px;font-weight:600" title="${esc(x.t.name)}">${esc(x.t.name)}</td><td class="lft" style="font-family:Barlow,sans-serif;font-size:12.5px;color:var(--muted)">${esc(x.t.region)}</td>${KPIS.map(k=>heat(x.c.scores[k.key])).join('')}<td style="font-weight:700">${x.c.final.toFixed(1)}${part?'*':''}</td><td class="lft"><span class="gchip" style="background:${x.c.grade.color}">${esc(x.c.grade.label)}</span></td></tr>`}).join('')+'</tbody></table>';
  if(!pick.length)rt='<div class="sl-none">No graded Trade Supervisors in this scope yet.</div>';

  // watchlist
  const WL=3;
  let co=wl.slice(0,WL).map(x=>`<div><b title="${esc(x.t.name)}">${esc(x.t.name)} <small style="font-weight:500;color:var(--muted)">${esc(x.t.region)}</small></b><span title="${esc(x.w.join('; '))}">${esc(x.w.join('; '))}</span><em>${x.c&&x.c.final!=null?x.c.final.toFixed(1)+'%':'—'}</em></div>`).join('');
  co=wl.length?`<div class="sl-coach">${co}</div>${wl.length>WL?`<div class="sl-none" style="padding:2px 0 0">and ${wl.length-WL} more on the watchlist</div>`:''}`:'<div class="sl-none">No Trade Supervisor is on the watchlist.</div>';

  // region ranking
  const regs=[...new Set(graded.map(x=>x.t.region))].map(r=>{const g=graded.filter(x=>x.t.region===r);return {r,v:avg(g.map(x=>x.c.final)),c:g.length}}).sort((a,b)=>b.v-a.v);
  const RL=9;
  const bar=(w,c)=>`<span class="sl-bar"><i style="width:${Math.max(0,Math.min(100,w))}%;background:${c}"></i></span>`;
  let rg=regs.slice(0,RL).map((x,i)=>`<div class="sl-rb"><span>${i+1}. ${esc(x.r)}</span>${bar(x.v,gradeOf(x.v).color==='#7dd3fc'?'#38B2E6':gradeOf(x.v).color)}<small>${x.c} TS</small><b>${x.v.toFixed(1)}%</b></div>`).join('');
  if(!regs.length)rg='<div class="sl-none">No grades yet.</div>';
  const regTitle=reg?`Region: ${esc(reg)}`:'Region ranking';
  const regSub=regs.length>RL?`Top ${RL} of ${regs.length}, by average score`:'Average final score';

  // KPI and BU
  const kb=KPIS.map(k=>{const a=avg(graded.map(x=>x.c.scores[k.key]).filter(s=>s!=null));return `<div class="sl-rb" style="grid-template-columns:114px 1fr 0 38px"><span>${esc(k.short)}</span>${bar(a==null?0:a*100,'#2A5FD9')}<small></small><b>${a==null?'—':Math.round(a*100)+'%'}</b></div>`}).join('');
  const bb=BUS.map(b=>{let q=0,d=0;graded.forEach(x=>{const y=(x.r.bu||{})[b]||{};q+=n(y.required);d+=Math.min(buDone(y),n(y.required))});const r=q?d/q:null;
    return `<div class="sl-rb" style="grid-template-columns:34px 1fr 64px 40px"><span>${b}</span>${bar(r==null?0:r*100,'#2F57C9')}<small>${fmtN(d)}/${fmtN(q)}</small><b>${r==null?'—':Math.round(r*100)+'%'}</b></div>`}).join('');

  // grade distribution
  const gs=[...S.grades].sort((a,b)=>b.min-a.min),N=graded.length;
  const gcnt=gs.map(g=>({g,c:graded.filter(x=>x.c.grade.label===g.label).length}));
  const stk=N?`<div class="sl-stack" style="height:24px;margin:4px 0 6px">${gcnt.filter(x=>x.c).map(x=>`<i style="width:${x.c/N*100}%;background:${x.g.color};color:#10232C">${x.c/N>=.07?x.c:''}</i>`).join('')}</div>
    <div class="sl-stk-l" style="gap:4px 10px;font-size:12px">${gcnt.filter(x=>x.c).map(x=>`<span><i style="background:${x.g.color}"></i>${esc(x.g.label)} <b>${x.c}</b></span>`).join('')}</div>`:'<div class="sl-none">No grades yet.</div>';

  const d=new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
  const scope=reg?`Scope: ${reg}`:'Scope: all regions';
  $('slide').innerHTML=`
    <div class="sl-head"><div><h1>TS POSM KPI Grading</h1><p>${esc(reg||'All regions')} · ${esc(lastPullText())}</p></div>
      <div class="when"><b>RMAS KPI report</b>Prepared ${d}</div></div>
    <div class="sl-kpis">${kpis}</div>
    <div class="sl-body" style="grid-template-columns:1.12fr 1fr">
      <div class="sl-left">
        <div class="sl-box"><h3>${slideMode==='top'?'Top Trade Supervisors':'Lowest-scoring Trade Supervisors'}<span>${slideMode==='top'?`Top ${pick.length} of ${N} graded`:`Bottom ${pick.length} of ${N} graded, lowest first`}</span></h3>${rt}</div>
        <div class="sl-box"><h3>Needs coaching<span>Below 80%, rated Poor, or grade disputed</span></h3>${co}</div>
      </div>
      <div class="sl-right" style="grid-template-rows:1fr auto auto">
        <div class="sl-box"><h3>${regTitle}<span>${regSub}</span></h3>${rg}</div>
        <div class="sl-pair">
          <div class="sl-box"><h3>Average per KPI</h3>${kb}</div>
          <div class="sl-box"><h3>Deployment per BU</h3>${bb}</div>
        </div>
        <div class="sl-box"><h3>Grade distribution<span>${N} TS graded</span></h3>${stk}</div>
      </div>
    </div>
    <div class="sl-foot"><span>${esc(scope)}. Weights: ${KPIS.map(k=>`${k.short} ${S.weights[k.key]}%`).join(', ')}.${partN?' * Partial grade: some KPIs not encoded yet.':''}</span>
      <span class="lg">KPI cells:<i style="background:var(--ok)"></i>90%+<i style="background:var(--warn)"></i>80–89%<i style="background:var(--bad)"></i>below 80%</span></div>`;
  fitSlide();
}
const fmtN=v=>Number(v||0).toLocaleString('en-US');
function fitSlide(){
  const st=$("slideStage"),fit=$("slideFit"),sl=$("slide");
  const w=Math.max(280,st.clientWidth-32), sc=Math.min(1,w/1280);
  sl.style.transform=`scale(${sc})`;fit.style.width=1280*sc+"px";fit.style.height=720*sc+"px";
}
window.addEventListener("resize",()=>{if($("slideDlg").open)fitSlide();});
$("slideBtn").onclick=()=>{$("slideDlg").showModal();buildSlide();};
$("slideClose").onclick=()=>$("slideDlg").close();
document.querySelectorAll("#slideSeg button").forEach(b=>b.onclick=()=>{slideMode=b.dataset.g;document.querySelectorAll("#slideSeg button").forEach(x=>x.setAttribute("aria-pressed",x===b));buildSlide();});

async function slideBlob(){
  if(typeof html2canvas==="undefined")throw new Error("noh2c");
  if(document.fonts&&document.fonts.ready)await document.fonts.ready;
  const host=document.createElement("div");host.style.cssText="position:fixed;left:0;top:0;width:1280px;height:720px;z-index:-1;pointer-events:none";
  const cl=$("slide").cloneNode(true);cl.removeAttribute("id");cl.style.transform="none";host.appendChild(cl);document.body.appendChild(host);
  try{const cv=await html2canvas(cl,{scale:2,backgroundColor:"#EEF2F1",logging:false,useCORS:true,width:1280,height:720,windowWidth:1280,windowHeight:720,scrollX:0,scrollY:0});
    return await new Promise(r=>cv.toBlob(r,"image/png"));}
  finally{host.remove();}
}
function slideName(){return "ts_posm_kpi_slide_"+new Date().toISOString().slice(0,10)+".png";}
async function withBusy(btn,fn){btn.disabled=true;const t=btn.textContent;btn.textContent="Preparing…";try{await fn();}finally{btn.disabled=false;btn.textContent=t;}}
$("slidePng").onclick=()=>withBusy($("slidePng"),async()=>{
  let blob;try{blob=await slideBlob();}catch(e){toast("Could not render the image. Use Print or save PDF instead.");return;}
  const filename=slideName();
  try{const dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null;if(dl){await dl.save({filename,data:blob});toast("Slide downloaded");return;}}
  catch(err){if(err&&err.code==="declined")return;}
  try{const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);toast("Slide downloaded");}
  catch(e){toast("Download is not available in this view. Use Copy image instead.");}
});
$("slideCopy").onclick=()=>withBusy($("slideCopy"),async()=>{
  try{if(!navigator.clipboard||typeof ClipboardItem==="undefined")throw 0;
    await navigator.clipboard.write([new ClipboardItem({"image/png":slideBlob()})]);toast("Slide copied. Paste it into PowerPoint or your email.");}
  catch(e){toast("This browser blocked copying. Use Download PNG instead.");}
});
$("slidePrint").onclick=()=>{
  const h=$("printHost");h.innerHTML="";const cl=$("slide").cloneNode(true);cl.removeAttribute("id");h.appendChild(cl);
  $("slideDlg").close();document.body.classList.add("printing");
  const done=()=>{document.body.classList.remove("printing");h.innerHTML="";window.removeEventListener("afterprint",done);};
  window.addEventListener("afterprint",done);setTimeout(()=>window.print(),50);
};

document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('slideDlg').open)$('slideDlg').close()});

/* =====================================================================
   BOOT
   ===================================================================== */
applyRole();
// Continuous refresh: Admin devices pull the latest from the Deployment KPI Tool + Inventory Tool on open and every 10 minutes.
// Background pulls never re-render the Encode / Settings / Import pages, so typing is not interrupted.
let BG=false,refreshing=false;
async function autoRefresh(){return;if(!isAdmin()||refreshing||document.visibilityState!=='visible')return;const src=S.sources;refreshing=true;BG=true;
  try{if(src.inventoryUrl)await syncTsFromInventory(false);
    if(src.deploymentUrl&&src.depAutoPull)await pullDeployments(LIVE,false);
    if(src.inventoryUrl&&src.autoPull)await pullInventory(LIVE,false)}
  finally{BG=false;refreshing=false}
  if(['dash','card'].includes(view)&&!$('modalHost').innerHTML)render()}
$('refreshBtn').onclick=async()=>{const b=$('refreshBtn');b.disabled=true;b.textContent='Refreshing…';
  try{await pullAllSources(LIVE,true)}finally{b.disabled=false;b.textContent='Refresh data';render()}};
setInterval(autoRefresh,600000);
(async()=>{if(sheetUrl)await pullRemote(false);await autoRefresh();render()})();
</script>

<script>
(function(){
  var base = location.href.split(/[?#]/)[0].replace(/[^\/]*$/, '');
  var map = {inventory: base+'inventory.html', request: base+'inventory.html#requests', proof: base+'inventory.html#requests',
             scorecard: base+'scorecard.html', guides: base+'index.html#guides', home: base+'index.html'};
  function fix(){
    document.querySelectorAll('.vs-suite a, a.vs-back, a.vs-mhome').forEach(function(a){
      var h = a.getAttribute('href')||'', k = a.getAttribute('data-vs');
      if(!k){
        if(/VS-INVENTORY/.test(h)) k='inventory'; else if(/#proof/.test(h)) k='proof'; else if(/VS-REQUEST/.test(h)) k='request';
        else if(/VS-TS-GRADING/.test(h)) k='scorecard'; else if(/#guides/.test(h)) k='guides'; else if(/CE-VAULT-SYNC/.test(h)) k='home';
      }
      if(k==='proof'){ a.remove(); return; }
      if(map[k]) a.setAttribute('href', map[k]);
      a.removeAttribute('target');
    });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', fix); else fix();
})();
</script>
<script>
(function(){
  // Hide the acknowledge / dispute row (it is for Trade Supervisors, not for viewers).
  function hideAck(){ ['ackOk','ackNo','ackReset'].forEach(function(id){ var b=document.getElementById(id); if(b && b.parentElement) b.parentElement.style.display='none'; }); }
  new MutationObserver(hideAck).observe(document.getElementById('v-card'), {childList:true, subtree:true});
  document.getElementById('vsvXlsx').onclick = function(){
    if(typeof XLSX==='undefined'){ alert('The Excel library is still loading — try again in a few seconds.'); return; }
    var rows = flatRows(), wb = XLSX.utils.book_new(), ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = rows[0].map(function(h,i){ return {wch: Math.min(40, Math.max(10, String(h).length + 2, i<2 ? 22 : 0))}; });
    XLSX.utils.book_append_sheet(wb, ws, 'TS KPI Grades');
    XLSX.writeFile(wb, 'TS-POSM-KPI-Grades-' + new Date().toISOString().slice(0,10) + '.xlsx');
  };
  // PDF = the browser's "Save as PDF" of the page currently shown (Dashboard or a TS Scorecard).
  document.getElementById('vsvPdf').onclick = function(){ window.print(); };
})();
</script>
